; PHP limits for production — optimized for Railway 512MB RAM
memory_limit=256M
max_execution_time=60
upload_max_filesize=20M
post_max_size=25M

; ===== Production hardening =====
; Hide PHP version from response headers (removes X-Powered-By: PHP/x.y.z)
expose_php=Off
; Never show PHP errors to users (logged instead); APP_DEBUG=false handles Laravel UI
display_errors=Off
log_errors=On
; Hide session cookie details; tighten serialization
session.cookie_httponly=On
session.use_strict_mode=On
