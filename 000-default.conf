<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ===== Production security headers (mod_headers) =====
    # Prevent clickjacking — this app is not meant to be framed
    Header always set X-Frame-Options "SAMEORIGIN"
    # Prevent MIME-type sniffing
    Header always set X-Content-Type-Options "nosniff"
    # Force HTTPS for 1 year (Render already 301-redirects HTTP, this locks the browser)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # Limit referrer leakage to same origin
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Lock down browser features the app does not use
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # Belt-and-suspenders: strip the PHP version header (expose_php=Off already does this)
    Header always unset X-Powered-By
    # Legacy XSS protection for older browsers
    Header always set X-XSS-Protection "1; mode=block"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>